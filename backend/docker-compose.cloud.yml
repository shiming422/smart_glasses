services:
  aiglass:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: aiglass-backend:cpu-cloud
    container_name: aiglass
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIGLASS_HOST: 0.0.0.0
      AIGLASS_PORT: ${AIGLASS_PORT:-8765}
      AIGLASS_CAMERA_SOURCE: ${AIGLASS_CAMERA_SOURCE:-udp}
      AIGLASS_CAMERA_UDP_PORT: ${AIGLASS_CAMERA_UDP_PORT:-22345}
      AIGLASS_CAMERA_UDP_FRAME_TTL_MS: ${AIGLASS_CAMERA_UDP_FRAME_TTL_MS:-250}
      AIGLASS_CAMERA_CTRL_WS_ENABLED: ${AIGLASS_CAMERA_CTRL_WS_ENABLED:-1}
      AIGLASS_CAMERA_CHAT_FRAMESIZE: ${AIGLASS_CAMERA_CHAT_FRAMESIZE:-QVGA}
      AIGLASS_CAMERA_CHAT_QUALITY: ${AIGLASS_CAMERA_CHAT_QUALITY:-28}
      AIGLASS_CAMERA_CHAT_FPS: ${AIGLASS_CAMERA_CHAT_FPS:-5}
      AIGLASS_CAMERA_NAV_FRAMESIZE: ${AIGLASS_CAMERA_NAV_FRAMESIZE:-QVGA}
      AIGLASS_CAMERA_NAV_QUALITY: ${AIGLASS_CAMERA_NAV_QUALITY:-28}
      AIGLASS_CAMERA_NAV_FPS: ${AIGLASS_CAMERA_NAV_FPS:-5}
      AIGLASS_CAMERA_AUTOTUNE_QUALITY: ${AIGLASS_CAMERA_AUTOTUNE_QUALITY:-36}
      AIGLASS_CAMERA_AUTOTUNE_FPS: ${AIGLASS_CAMERA_AUTOTUNE_FPS:-5}
      AIGLASS_CAMERA_AUTOTUNE_WARMUP_SEC: ${AIGLASS_CAMERA_AUTOTUNE_WARMUP_SEC:-60}
      AIGLASS_UDP_PORT: ${AIGLASS_UDP_PORT:-12345}
      AIGLASS_DISCOVERY_PORT: ${AIGLASS_DISCOVERY_PORT:-54321}
      AIGLASS_DISCOVERY_HOST: ${AIGLASS_DISCOVERY_HOST:-47.110.89.207}
      AIGLASS_AUDIO_WS_ENABLED: ${AIGLASS_AUDIO_WS_ENABLED:-1}
      AIGLASS_NAV_DIRECT_VIEWER: ${AIGLASS_NAV_DIRECT_VIEWER:-1}
      AIGLASS_NAV_SKIP_BACKEND_ANNOTATION: ${AIGLASS_NAV_SKIP_BACKEND_ANNOTATION:-1}
      AIGLASS_NAV_INFER_MIN_INTERVAL_MS: ${AIGLASS_NAV_INFER_MIN_INTERVAL_MS:-300}
      AIGLASS_PATH_FRAME_DIV: ${AIGLASS_PATH_FRAME_DIV:-2}
      AIGLASS_NAV_RAW_BETWEEN_OVERLAYS: ${AIGLASS_NAV_RAW_BETWEEN_OVERLAYS:-0}
      AIGLASS_STREAM_IDLE_SILENCE: ${AIGLASS_STREAM_IDLE_SILENCE:-0}
      AIGLASS_STREAM_IDLE_SILENCE_MS: ${AIGLASS_STREAM_IDLE_SILENCE_MS:-20}
      BLIND_PATH_MODEL: ${BLIND_PATH_MODEL:-model/yolo-seg.pt}
      OBSTACLE_MODEL: ${OBSTACLE_MODEL:-model/yoloe-11l-seg.pt}
      YOLOE_MODEL_PATH: ${YOLOE_MODEL_PATH:-model/yoloe-11l-seg.pt}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-model/shoppingbest5.pt}
      HAND_TASK_PATH: ${HAND_TASK_PATH:-model/hand_landmarker.task}
      TRAFFICLIGHT_MODEL: ${TRAFFICLIGHT_MODEL:-model/trafficlight.pt}
      ENABLE_TTS: ${ENABLE_TTS:-false}
      TTS_INTERVAL_SEC: ${TTS_INTERVAL_SEC:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SDL_AUDIODRIVER: ${SDL_AUDIODRIVER:-dummy}
      YOLO_CONFIG_DIR: ${YOLO_CONFIG_DIR:-/tmp/Ultralytics}
    ports:
      - "${AIGLASS_HOST_PORT:-8765}:${AIGLASS_PORT:-8765}/tcp"
      - "${AIGLASS_CAMERA_UDP_PORT:-22345}:${AIGLASS_CAMERA_UDP_PORT:-22345}/udp"
      - "${AIGLASS_UDP_PORT:-12345}:${AIGLASS_UDP_PORT:-12345}/udp"
      - "${AIGLASS_DISCOVERY_PORT:-54321}:${AIGLASS_DISCOVERY_PORT:-54321}/udp"
    volumes:
      - ./model:/app/model:ro
      - ./recordings:/app/recordings
      - ./runtime_logs:/app/runtime_logs
      - ./music:/app/music:ro
      - ./voice:/app/voice:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      - ./mobileclip_blt.ts:/app/mobileclip_blt.ts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://localhost:$${AIGLASS_PORT:-8765}/api/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
